[package]
name = "lynch_chart"
version = "0.1.0"
edition = "2021"
description = "Native renderer for the portal's per-ticker PEG chart (ui/fastchart.py loads it with ctypes)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lynch-chart"
path = "src/main.rs"

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }
miniz_oxide = "0.8"
crc32fast = "1"
jpeg-encoder = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
