[package]
name = "gpu_probe"
version = "0.1.0"
edition = "2021"
description = "Is a Metal renderer worth it for the per-ticker chart? Times what a GPU path cannot skip against the CPU draw"
license = "MIT"
publish = false

[workspace]

[dependencies]
lynch_chart = { path = ".." }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.31"
objc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
